<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirection — AutomationBoost</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d13;
  color:#eceef5;font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:24px;text-align:center}
.b{max-width:34ch;display:flex;flex-direction:column;gap:14px}
.m{font-size:17px;font-weight:600}
.s{color:#9599ad;font-size:14.5px}
a{color:#3dc4c2}
</style>
</head>
<body>
<div class="b">
  <div class="m">Un instant…</div>
  <p class="s">Si rien ne se passe, <a id="direct" href="https://automatisationboost.com/">continuez ici</a>.</p>
</div>
<script>
/* Page de redirection : elle affiche le domaine du site, pas celui de l'outil
   qui compte les clics. Un webhook brut dans un email froid ressemble à du
   hameçonnage — les filtres comme les humains le lisent ainsi.
   Le clic est signalé sans bloquer : la redirection part quoi qu'il arrive. */
(function () {
  var q = new URLSearchParams(location.search);
  var a = (q.get('a') || '').replace(/[^a-z0-9-]/gi, '');
  var quoi = q.get('q') === 'audit' ? 'audit' : 'rapport';
  var dest = quoi === 'audit'
    ? 'https://automatisationboost.com/audit.html'
    : 'https://previsualisation.automatisationboost.com/rapport-agence/' + a + '/';
  document.getElementById('direct').href = dest;
  try {
    fetch('https://n7n.automatisationboost.com/webhook/r?a=' + encodeURIComponent(a)
      + '&q=' + quoi + '&s=' + encodeURIComponent(q.get('s') || 'voyage') + '&nr=1',
      { mode: 'no-cors', keepalive: true }).catch(function () {});
  } catch (e) {}
  setTimeout(function () { location.replace(dest); }, 350);
})();
</script>
</body>
</html>
